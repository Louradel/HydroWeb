<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feedback | HydroWeb Jasaan</title>

<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ---------- ROOT ---------- */
:root {
  --blue-dark: #005b8f;
  --blue-mid: #0077a3;
  --blue-light: #b5e8fa;
  --card-bg: rgba(255, 255, 255, 0.35);
  --text-dark: #053b5e;
  --danger: #ef5350;
  --accent: #00a8e8;
}

/* ---------- RESET ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: linear-gradient(135deg, #0e87c9, #0077A3, #b5e8fa);
  min-height: 100vh;
  color: var(--text-dark);
}

/* ---------- HEADER ---------- */
.topbar {
  background: rgba(0, 91, 143, 0.9);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 120px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 100;
}

.back-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  margin-right: 15px;
  cursor: pointer;
}

.header-title h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, #77d4f7, #d0eef7, #3a90f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ---------- MAIN CONTENT WRAPPER ---------- */
.main-wrapper {
  margin-top: 140px;
  padding: 20px;
  display: flex;
  justify-content: center;
}

/* ---------- FEEDBACK CONTAINER ---------- */
.feedback-container {
  width: 100%;
  max-width: 750px;
  min-height: 400px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

/* ---------- FEEDBACK CONTENT ---------- */
.feedback-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--blue-dark);
  margin-bottom: 20px;
  border-bottom: 2px solid var(--blue-light);
  padding-bottom: 8px;
}

/* Textarea */
textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
  height: 130px;
  font-size: 15px;
  outline: none;
}

textarea:focus {
  border-color: var(--accent);
}

/* Submit Button */
.submit-btn {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: none;
  color: white;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;

  background: linear-gradient(90deg, #0077a3, #00b4d8);
  position: relative;
  overflow: hidden;
}

.submit-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 120%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: 0.4s;
}

.submit-btn:hover::after {
  left: 100%;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0px 8px 18px rgba(0, 180, 216, 0.5);
}
</style>
</head>

<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='../customerspage/index.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">
    <h1>Feedback</h1>
  </div>
</div>

<div class="main-wrapper">
  <div class="feedback-container">

    <h2 class="feedback-title">We value your feedback</h2>

    <textarea id="feedbackText" placeholder="Write your feedback here..."></textarea>

    <button class="submit-btn" id="submitFeedback">Submit Feedback</button>
  </div>
</div>

<script>
// SUBMIT FEEDBACK
document.getElementById("submitFeedback").addEventListener("click", () => {
  const message = document.getElementById("feedbackText").value.trim();

  if (message === "") {
    alert("Please write your feedback.");
    return;
  }

  alert("Thank you for your feedback!");
});
</script>

</body>
</html>
