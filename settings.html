<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Settings | HydroWeb Jasaan</title>

<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<!-- External JS -->

<script src="settings.js" defer></script>

<style>
/* ---------- ROOT ---------- */
:root {
  --blue-dark: #005b8f;
  --blue-mid: #0077a3;
  --blue-light: #b5e8fa;
  --card-bg: rgba(255, 255, 255, 0.35);
  --text-dark: #053b5e;
  --danger: #ef5350;
  --accent: #00a8e8;
}

/* ---------- RESET ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: linear-gradient(135deg, #0e87c9, #0077A3, #b5e8fa);
  min-height: 100vh;
  color: var(--text-dark);
}

/* ---------- HEADER ---------- */
.topbar {
  background: rgba(0, 91, 143, 0.9);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 120px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 100;
}

.back-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  margin-right: 15px;
  cursor: pointer;
}

.header-title h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, #77d4f7, #d0eef7, #3a90f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ---------- MAIN WRAPPER ---------- */
.main-wrapper {
  margin-top: 140px;
  padding: 20px;
  display: flex;
  justify-content: center;
}

/* ---------- ONE MAIN CONTAINER ---------- */
.settings-container {
  width: 100%;
  max-width: 750px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* ---------- CARD STYLE ---------- */
.section-card {
  background: rgb(179, 217, 246);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 35px 30px;
  width: 100%;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
}

.section-card h2 {
  color: var(--blue-dark);
  font-size: 22px;
  margin-bottom: 25px;
  border-bottom: 2px solid var(--blue-light);
  padding-bottom: 8px;
}

/* ---------- INPUT GROUP ---------- */
.detail-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: 600;
  color: var(--blue-dark);
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

input[readonly] {
  background: #f4f8fb;
  cursor: not-allowed;
}

/* ---------- BUTTONS SHARED ---------- */
button {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
  padding: 10px 20px;
  color: #fff;
}

.edit-btn { background: linear-gradient(90deg, #0096c7, #00b4d8); }
.save-btn { background: linear-gradient(90deg, #0077a3, #0096c7); }
.cancel-btn { background: linear-gradient(90deg, #0077a3, #0096c7); }

button:hover { opacity: 0.9; }

.hidden { display: none; }

/* ---------- CONSISTENT ACTION BUTTONS ---------- */
.setting-row button,
.password-fields button {
  width: 180px; 
  text-align: center;
  font-size: 15px;
  border-radius: 10px;
  font-weight: 600;
  padding: 10px 0;
  transition: 0.3s ease;
}

/* Blue buttons */
/* ---------- COOL BUTTON HOVER EFFECTS ---------- */

/* Blue Buttons (Change Password, Save Password) */
.toggle-btn,
.save-btn {
  background: linear-gradient(90deg, #0077a3, #00b4d8);
  position: relative;
  overflow: hidden;
  
}

/* Animated gradient shine */
.toggle-btn::after,
.save-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 120%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: 0.4s;
  
}

/* Hover effect */
.toggle-btn:hover,
.save-btn:hover {
  transform: scale(1) translateY(-2px);
  box-shadow: 0px 8px 18px rgba(0, 180, 216, 0.5);
}

/* Shine animation */
.toggle-btn:hover::after,
.save-btn:hover::after {
  left: 100%;
}

/* ---------- Delete Button Hover (Red Pulse) ---------- */
.delete-btn {
  position: relative;
  background: #ef5350;
  overflow: hidden;
}

.delete-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle, rgba(255,255,255,0.2) 10%, transparent 40%);
  transform: scale(0);
  transition: transform 0.4s ease;
}

.delete-btn:hover {
  transform: scale(1) translateY(-2px);
  box-shadow: 0px 8px 20px rgba(239, 83, 80, 0.55);
}

/* Pulse effect */
.delete-btn:hover::after {
  transform: scale(2.5);
}


/* Password field spacing */
.password-fields input {
  margin-bottom: 12px;
}

/* ---------- SETTINGS SECTION ---------- */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.password-fields {
  display: none;
  flex-direction: column;
  margin-top: 15px;
}

.password-fields.active {
  display: flex;
}

/* ---------- MODAL ---------- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.modal {
  background: #fff;
  border-radius: 12px;
  padding: 25px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

.modal button {
  padding: 8px 16px;
  margin: 0 5px;
  border-radius: 8px;
}

.confirm-delete {
  background: var(--danger);
  color: #fff;
}
</style>
</head>

<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='../customerspage/index.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">
    <h1>Account Settings</h1>
  </div>
</div>

<div class="main-wrapper">

  <!-- 🟦 ONE SINGLE CONTAINER -->
  <div class="settings-container">

    <!-- PERSONAL DETAILS -->
    <div class="section-card">
      <h2>Personal Information</h2>

      <div class="detail-group">
        <label>Full Name</label>
        <input type="text" id="fullname" readonly>
      </div>

      <div class="detail-group">
        <label>Contact</label>
        <input type="text" id="contact" readonly>
      </div>

      <div class="detail-group">
        <label>Address</label>
        <input type="text" id="address" readonly>
      </div>

      <div class="btn-group" id="defaultButtons">
        <button class="edit-btn" id="editBtn"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
      </div>

      <div class="btn-group hidden" id="editButtons">
        <button class="save-btn" id="saveBtn"><i class="fa-solid fa-check"></i> Save</button>
        <button class="cancel-btn" id="cancelBtn"><i class="fa-solid fa-xmark"></i> Cancel</button>
      </div>
      <br><br>

      <h2></h2>

      <div class="setting-row">
        <label>Change Password</label>
        <button class="toggle-btn" id="togglePasswordBtn">Change Password</button>
      </div>

      <div class="password-fields" id="passwordFields">
        <input type="password" id="currentPassword" placeholder="Current Password">
        <input type="password" id="newPassword" placeholder="New Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button class="save-btn" id="savePasswordBtn">Save Changes</button>
      </div>

      <div class="setting-row">
        <label>Delete Account</label>
        <button class="delete-btn" id="deleteAccountBtn">Delete Account</button>
      </div>
      
    </div>

    

  </div> <!-- END settings-container -->
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>Delete Account</h3>
    <p>Are you sure you want to delete your account? This action is permanent.</p>
    <button class="cancel-btn" id="cancelDelete">Cancel</button>
    <button class="confirm-delete" id="confirmDelete">Yes, Delete</button>
  </div>
</div>

</body>
</html>
